<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Sudhanshu</title>
<meta name="description" content="A voice bot that answers interview questions as Sudhanshu Patil.">
<style>
  :root { --bg:#f6f5f1; --fg:#1b1b1a; --muted:#6b6a65; --card:#fff; --line:#e4e2da; --accent:#2f5bea; --rec:#d93c3c }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#f1efe8; --muted:#9a988f; --card:#1e1e1c; --line:#33322f; --accent:#7b9bff; --rec:#ff6b6b } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; min-height:100vh; display:flex; justify-content:center }
  main { width:100%; max-width:640px; padding:24px 16px 32px; display:flex; flex-direction:column; gap:16px }
  h1 { font-size:1.4rem; margin:0 }
  p.sub { margin:0; color:var(--muted) }
  #log { display:flex; flex-direction:column; gap:10px; min-height:140px }
  .msg { padding:10px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); max-width:92% }
  .msg.you { align-self:flex-end; background:var(--accent); color:#fff; border-color:transparent }
  .msg small { display:block; color:var(--muted); font-size:.75rem }
  .you small { color:#dfe6ff }
  #mic { align-self:center; width:96px; height:96px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:2rem; cursor:pointer }
  #mic.rec { background:var(--rec); animation:pulse 1.2s infinite }
  #mic:disabled { opacity:.5; cursor:wait }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(217,60,60,.2) } }
  @media (prefers-reduced-motion: reduce) { #mic.rec { animation:none } }
  #status { text-align:center; color:var(--muted); min-height:1.5em }
  .chips { display:flex; flex-wrap:wrap; gap:8px }
  .chips button { font:inherit; font-size:.9rem; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer }
  form { display:flex; gap:8px }
  input { flex:1; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg) }
  form button { font:inherit; padding:10px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px }
</style>
</head>
<body>
<main>
  <header>
    <h1>Talk to Sudhanshu</h1>
    <p class="sub">An AI voice version of me. Tap the mic, ask anything an interviewer would, and tap again to send. No sign-up, no keys.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <button id="mic" aria-label="Start recording">🎤</button>
  <div id="status" role="status">Tap the mic to start</div>
  <div class="chips" id="chips"></div>
  <form id="form"><input id="text" placeholder="Or type a question" aria-label="Type a question" maxlength="500"><button>Ask</button></form>
</main>
<script src="app.js"></script>
</body>
</html>
